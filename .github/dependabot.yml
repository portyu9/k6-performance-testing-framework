version: 2
updates:
  - package-ecosystem: docker
    directory: "/docker"
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 10
    groups:
      # Keep source-provenance repair separate from independently safe runtime updates.
      k6-release:
        patterns: ["grafana/k6"]
        update-types: ["minor", "patch"]
      routine-dependencies:
        patterns: ["*"]
        exclude-patterns: ["grafana/k6"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: gomod
    directory: "/docker/security-overrides"
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      security-overrides:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: github-actions
    directory: "/"
    rebase-strategy: auto
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    groups:
      routine-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "deps"
      include: "scope"
