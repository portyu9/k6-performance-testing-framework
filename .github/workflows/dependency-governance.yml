name: dependency-governance

on:
  pull_request:
    paths:
      - '.github/dependabot.yml'
      - '.github/dependency-governance.json'
      - '.github/dependency-recovery.json'
      - '.github/scripts/dependency_governance.py'
      - '.github/scripts/dependency_governance_selfcheck.py'
      - '.github/scripts/dependency_governance_lib/**'
      - '.github/scripts/dependency_recovery.py'
      - '.github/scripts/dependency_recovery_selfcheck.py'
      - '.github/scripts/dependency_repair.py'
      - '.github/scripts/dependency_repair_selfcheck.py'
      - '.github/workflows/dependency-governance.yml'
  push:
    branches: [main]
  workflow_run:
    workflows: [ci, extended, security, docs]
    types: [completed]
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:
    inputs:
      pr-number:
        description: 'Open Dependabot pull request number to re-evaluate'
        required: true
        type: string
      allow-merge:
        description: 'Permit merge if every governance proof is satisfied'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  # One privileged reconciliation lock prevents schedule/workflow_run/target races
  # from duplicating owner comments, approvals, repairs, retries, or merge attempts.
  # Pull-request self-tests remain isolated by their untrusted head branch.
  group: dependency-governance-${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || 'reconcile' }}
  cancel-in-progress: false

env:
  GOVERNANCE_CONFIG: .github/dependency-governance.json
  RECOVERY_CONFIG: .github/dependency-recovery.json

jobs:
  self-test:
    name: governance-self-test
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout proposed governance code without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Compile governance and recovery control plane
        run: >-
          python -m py_compile
          .github/scripts/dependency_governance.py
          .github/scripts/dependency_governance_selfcheck.py
          .github/scripts/dependency_governance_lib/*.py
          .github/scripts/dependency_recovery.py
          .github/scripts/dependency_recovery_selfcheck.py
          .github/scripts/dependency_repair.py
          .github/scripts/dependency_repair_selfcheck.py
      - name: Validate governance and recovery configuration
        run: |
          python .github/scripts/dependency_governance.py --validate-config
          python .github/scripts/dependency_recovery.py --validate-config
      - name: Exercise dependency-governance and recovery policy self-checks
        run: |
          python .github/scripts/dependency_governance_selfcheck.py
          python .github/scripts/dependency_recovery_selfcheck.py
          python .github/scripts/dependency_repair_selfcheck.py

  govern:
    name: govern-dependabot
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == 'refs/heads/main' &&
      github.event.repository.default_branch == 'main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'dependabot/')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Authenticate exact-current-main privileged wake
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_WORKFLOW_REF" = "$GITHUB_REPOSITORY/.github/workflows/dependency-governance.yml@refs/heads/main"
          live_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq .object.sha)"
          test "$live_main" = "$GITHUB_SHA"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_run" ]]; then
            run_id="$(jq -er '.workflow_run.id' "$GITHUB_EVENT_PATH")"
            [[ "$run_id" =~ ^[1-9][0-9]*$ ]]
            # Canonical REST provenance: a webhook is merely a wake hint,
            # never an authorization credential or a substitute for CI gates.
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" |
              jq -e --arg repo "$GITHUB_REPOSITORY" '
                .repository.full_name == $repo and
                .head_repository.full_name == $repo and
                .event == "pull_request" and
                .status == "completed" and .conclusion == "success" and
                (.head_branch | startswith("dependabot/")) and
                (
                  (.name == "ci" and .path == ".github/workflows/ci.yml") or
                  (.name == "extended" and .path == ".github/workflows/extended.yml") or
                  (.name == "security" and .path == ".github/workflows/security.yml") or
                  (.name == "docs" and .path == ".github/workflows/docs.yml")
                )
              ' >/dev/null
          fi
      - name: Checkout trusted default-branch governance code only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Validate trusted governance and recovery configuration
        run: |
          python .github/scripts/dependency_governance.py --validate-config
          python .github/scripts/dependency_recovery.py --validate-config
      - name: Apply deterministic dependency repair
        if: github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDABOT_OWNER_TOKEN: ${{ secrets.DEPENDABOT_OWNER_TOKEN }}
          TARGET_PR_NUMBER: ${{ inputs['pr-number'] || '' }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
        run: python .github/scripts/dependency_repair.py
      - name: Attempt bounded dependency recovery
        if: github.event_name != 'push'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RECOVERY_EVENT_NAME: ${{ github.event_name }}
          TARGET_PR_NUMBER: ${{ github.event.pull_request.number || inputs['pr-number'] || '' }}
          WORKFLOW_RUN_HEAD_BRANCH: ${{ github.event.workflow_run.head_branch || '' }}
          ALLOW_RECOVERY_RERUN: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python .github/scripts/dependency_recovery.py
      - name: Reconcile dependency governance
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPENDABOT_OWNER_TOKEN: ${{ secrets.DEPENDABOT_OWNER_TOKEN }}
          ALLOW_MERGE: ${{ github.event_name == 'workflow_run' || github.event_name == 'schedule' || github.event_name == 'push' || inputs['allow-merge'] }}
        run: python .github/scripts/dependency_governance.py
