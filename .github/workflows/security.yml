name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.repository }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain-policy:
    name: Supply-chain policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate immutable workflow and runtime provenance
        run: |
          python3 .github/scripts/validate_workflow_pins.py
          python3 .github/scripts/validate_runtime_provenance.py
          python3 .github/scripts/validate_security_stack.py

  codeql_source:
    name: CodeQL source stack
    needs: supply-chain-policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Initialize CodeQL for JavaScript, Python, and Actions
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript,python,actions
          queries: security-extended
      - name: Analyze JavaScript, Python, and Actions
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

  codeql_go:
    name: CodeQL Go
    needs: supply-chain-policy
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: read
      security-events: write
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up repository Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: docker/security-overrides/go.mod
          cache: false
      - name: Initialize CodeQL for Go
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go
          build-mode: manual
          queries: security-extended
      - name: Compile repository-owned Go security override package
        working-directory: docker/security-overrides
        run: go test -mod=mod ./...
      - name: Analyze Go
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go

  shellcheck:
    name: ShellCheck
    needs: supply-chain-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install digest-verified ShellCheck v0.11.0
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/shellcheck-v0.11.0.linux.x86_64.tar.xz
          curl --proto '=https' --tlsv1.2 --fail --location --retry 3 \
            --output "$archive" \
            https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo '8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  '"$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C /tmp
          /tmp/shellcheck-v0.11.0/shellcheck --version
      - name: Scan every tracked shell source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' shell_files < <(git ls-files -z '*.sh' '*.bash' '*.zsh' '*.ksh')
          if (( ${#shell_files[@]} == 0 )); then
            echo 'no tracked shell sources discovered' >&2
            exit 1
          fi
          /tmp/shellcheck-v0.11.0/shellcheck --severity=warning "${shell_files[@]}"
  trivy-repository:
    name: Trivy repository policy
    needs: supply-chain-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare evidence directory
        run: mkdir -p reports/security
      - name: Scan repository configuration and committed secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: misconfig,secret
          severity: HIGH,CRITICAL
          format: json
          output: reports/security/trivy.json
          exit-code: "1"
      - name: Require attributed repository security evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="reports/security/trivy.json"
          summary="reports/security/summary.md"
          python3 .github/scripts/validate_security_evidence.py repository "$report"
          misconfigurations=$(jq '[.Results[]? | .Misconfigurations[]?] | length' "$report")
          secrets=$(jq '[.Results[]? | .Secrets[]?] | length' "$report")
          {
            echo '### Repository security gate'
            echo
            echo '| Signal | Findings |'
            echo '| --- | ---: |'
            echo "| HIGH/CRITICAL misconfigurations | ${misconfigurations} |"
            echo "| Gated secret findings | ${secrets} |"
            echo
            echo '- Scanner: Trivy v0.74.0'
            echo '- Scope: repository configuration and committed secret material.'
            echo '- Evidence must contain an attributed `docker/Dockerfile` configuration result.'
            echo '- Runtime dependency vulnerability coverage belongs to the separately built image scan.'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload repository security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-repository-evidence-${{ github.run_id }}
          path: reports/security/
          if-no-files-found: error
          retention-days: 14

  container-image:
    name: Trivy k6 image
    needs: supply-chain-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare evidence directory
        run: mkdir -p reports/security/image
      - name: Build tracked k6 image
        run: docker build -f docker/Dockerfile -t qa-k6:security .
      - name: Scan built k6 image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.74.0
          scan-type: image
          image-ref: qa-k6:security
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          list-all-pkgs: true
          format: json
          output: reports/security/image/container-image.json
          exit-code: "1"
      - name: Require attributed built-image security evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          report="reports/security/image/container-image.json"
          summary="reports/security/image/summary.md"
          python3 .github/scripts/validate_security_evidence.py image "$report"
          alpine_packages=$(jq '[.Results[]? | select(.Class == "os-pkgs" and .Type == "alpine") | .Packages[]?] | length' "$report")
          go_packages=$(jq '[.Results[]? | select(.Target == "usr/bin/k6" and .Class == "lang-pkgs" and .Type == "gobinary") | .Packages[]?] | length' "$report")
          vulnerabilities=$(jq '[.Results[]? | .Vulnerabilities[]?] | length' "$report")
          k6_version=$(awk -F= '$1 == "ARG K6_VERSION" { print $2; exit }' docker/Dockerfile)
          go_version=$(sed -nE 's/^FROM --platform=\$BUILDPLATFORM golang:([0-9]+\.[0-9]+\.[0-9]+)-alpine.*$/\1/p' docker/Dockerfile | head -n1)
          x_crypto_version=$(awk '$1 == "require" && $2 == "golang.org/x/crypto" { print $3; exit } $1 == "golang.org/x/crypto" { print $2; exit }' docker/security-overrides/go.mod)
          grpc_version=$(awk '$1 == "require" && $2 == "google.golang.org/grpc" { print $3; exit } $1 == "google.golang.org/grpc" { print $2; exit }' docker/security-overrides/go.mod)
          test -n "$x_crypto_version"
          test -n "$grpc_version"
          {
            echo '### Built k6 image vulnerability gate'
            echo
            echo "- Alpine runtime packages: \`${alpine_packages}\`"
            echo "- Go binary packages: \`${go_packages}\`"
            echo "- Upstream k6 source: exact tagged module \`v${k6_version}\`; scanned binary correctly records \`v${k6_version}+dirty\` because governed dependency security overrides are applied before compilation."
            echo "- Proven security overrides: \`golang.org/x/crypto ${x_crypto_version}\`, \`google.golang.org/grpc ${grpc_version}\`"
            echo "- Proven Go stdlib: \`v${go_version}\`"
            echo "- Fixable HIGH/CRITICAL findings: \`${vulnerabilities}\`"
            echo '- Scanner: Trivy v0.74.0 image mode with full package inventory retained.'
          } | tee "$summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload container security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-container-evidence-${{ github.run_id }}
          path: reports/security/image/
          if-no-files-found: error
          retention-days: 14

  dependency-review:
    name: dependency-review
    needs: supply-chain-policy
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe GitHub Dependency graph
        id: dependency-graph
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh api \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "repos/$GITHUB_REPOSITORY/dependency-graph/sbom" >/dev/null 2>&1; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
            echo 'GitHub Dependency graph is available; running change-aware Dependency Review.'
          else
            echo 'available=false' >> "$GITHUB_OUTPUT"
            echo '::warning::GitHub Dependency graph is unavailable; repository configuration/secret policy and attributed built-image vulnerability scanning remain independent gates, but change-aware Dependency Review cannot run.'
            {
              echo '### Dependency Review fallback'
              echo
              echo 'GitHub Dependency graph is unavailable for this repository, so pull-request dependency-diff analysis cannot run.'
              echo 'Independent repository configuration/secret policy and attributed built-image vulnerability scanning remain required.'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Review dependency changes
        if: steps.dependency-graph.outputs.available == 'true'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
      - name: Confirm independent fallback gates
        if: steps.dependency-graph.outputs.available != 'true'
        run: echo 'Dependency Review service unavailable; repository policy and attributed built-image vulnerability gates remain required.'

  security-gate:
    name: security-gate
    if: always()
    needs: [supply-chain-policy, codeql_source, codeql_go, shellcheck, trivy-repository, container-image, dependency-review]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require applicable full-stack security domains
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          REPOSITORY: ${{ github.repository }}
          SUPPLY_CHAIN_RESULT: ${{ needs.supply-chain-policy.result }}
          CODEQL_SOURCE_RESULT: ${{ needs.codeql_source.result }}
          CODEQL_GO_RESULT: ${{ needs.codeql_go.result }}
          SHELLCHECK_RESULT: ${{ needs.shellcheck.result }}
          REPOSITORY_TRIVY_RESULT: ${{ needs.trivy-repository.result }}
          IMAGE_TRIVY_RESULT: ${{ needs.container-image.result }}
          DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
        run: |
          set -euo pipefail

          if [[ "$SUPPLY_CHAIN_RESULT" != "success" ]]; then
            echo "supply_chain_policy=$SUPPLY_CHAIN_RESULT" >&2
            exit 1
          fi
          if [[ "$SHELLCHECK_RESULT" != "success" ]]; then
            echo "shellcheck=$SHELLCHECK_RESULT" >&2
            exit 1
          fi
          if [[ "$REPOSITORY_TRIVY_RESULT" != "success" || "$IMAGE_TRIVY_RESULT" != "success" ]]; then
            echo "repository_trivy=$REPOSITORY_TRIVY_RESULT image_trivy=$IMAGE_TRIVY_RESULT" >&2
            exit 1
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            if [[ "$DEPENDENCY_REVIEW_RESULT" != "success" ]]; then
              echo "dependency_review=$DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            fi
            if [[ "$HEAD_REPOSITORY" == "$REPOSITORY" ]]; then
              if [[ "$CODEQL_SOURCE_RESULT" != "success" || "$CODEQL_GO_RESULT" != "success" ]]; then
                echo "internal PR requires full CodeQL success; source=$CODEQL_SOURCE_RESULT go=$CODEQL_GO_RESULT" >&2
                exit 1
              fi
            elif [[ "$CODEQL_SOURCE_RESULT" != "skipped" || "$CODEQL_GO_RESULT" != "skipped" ]]; then
              echo "fork PR should skip CodeQL because security-events write is unavailable; source=$CODEQL_SOURCE_RESULT go=$CODEQL_GO_RESULT" >&2
              exit 1
            fi
          else
            if [[ "$CODEQL_SOURCE_RESULT" != "success" || "$CODEQL_GO_RESULT" != "success" ]]; then
              echo "non-PR security run requires full CodeQL success; source=$CODEQL_SOURCE_RESULT go=$CODEQL_GO_RESULT" >&2
              exit 1
            fi
            if [[ "$DEPENDENCY_REVIEW_RESULT" != "skipped" ]]; then
              echo "non-PR dependency review should be skipped; dependency_review=$DEPENDENCY_REVIEW_RESULT" >&2
              exit 1
            fi
          fi

          echo "Full-stack security gate passed: supply-chain policy, CodeQL JS/Python/Actions/Go, ShellCheck, repository config/secrets, built-image vulnerabilities, and applicable Dependency Review."
